# Runs what needs no graphics card on every push. The packaged build and the render evidence
# need a real GPU and stay on BUILD.ps1 on a developer's machine.
name: checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Architecture and format
        shell: powershell
        run: .\TEST.ps1 -Suite Architecture -TestTimeoutSeconds 600
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: work/qa/*.txt