# Runs what needs no graphics card on every push. The packaged build and the render evidence
# need a real GPU and stay on scripts/win/BUILD.ps1 on a developer's machine.
name: checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Architecture and format
        shell: powershell
        run: .\scripts\win\TEST.ps1 -Suite Architecture -TestTimeoutSeconds 600
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: work/qa/*.txt
  linux-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Architecture and format (no display, bundled tools)
        id: linux-check
        shell: bash
        env:
          SIGIL_TRIES_DIR: ${{ runner.temp }}/sigil-tries
        run: |
          source tools/linux/project.sh
          printf 'qa=%s\n' "$SIGIL_QA" >> "$GITHUB_OUTPUT"
          scripts/linux/TEST.sh Architecture --timeout 600
      - name: Keep the Linux reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-linux
          path: ${{ steps.linux-check.outputs.qa }}/*.txt
